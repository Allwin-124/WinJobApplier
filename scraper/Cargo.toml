[package]
name = "scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
postgres = { version = "0.19.7", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
reqwest = { version = "0.12.4", features = ["blocking"] }
anyhow = { version = "1.0.86" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1.3"
